spring.application.name=vance_spec_detailing

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/vance_detailing?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=vance
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.profiles.active=secret