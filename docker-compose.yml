version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: vance-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: vance_detailing
      MYSQL_USER: vance
      MYSQL_PASSWORD: vance
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: